spring:
  application:
    name: dawaguard
  config:
    # Local secrets live in .env (git-ignored). See .env.example.
    import: optional:file:.env[.properties]
  datasource:
    # Embedded, in-process only: no TCP server, no console.
    url: jdbc:h2:file:./data/dawaguard
    username: ${DB_USER:dawaguard}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    async:
      # A check takes 10-20 s (vision + reasoning models); leave headroom.
      request-timeout: 120s

server:
  # Hosting platforms pass the port to listen on in PORT.
  port: ${PORT:8080}
  # Trust X-Forwarded-For from the hosting platform's proxy, so rate limits apply per real client.
  forward-headers-strategy: native

dawaguard:
  nebius:
    base-url: https://api.tokenfactory.nebius.com/v1
    api-key: ${NEBIUS_API_KEY:}
    models:
      # Reads medicine strips (image -> structured fields)
      vision: ${MODEL_VISION:nvidia/Nemotron-3.5-Super-VL}
      # Explains the verdict, weighs evidence, writes the family-facing answer
      reasoning: ${MODEL_REASONING:nvidia/Nemotron-3-Ultra-550b-a55b}
      # Fast chat routing, translation, reminders
      fast: ${MODEL_FAST:nvidia/Nemotron-3_5-Lightning}
  tavily:
    base-url: https://api.tavily.com
    api-key: ${TAVILY_API_KEY:}
  cdsco:
    base-url: https://cdscoonline.gov.in/CDSCO
    sync-from: 2025-01
    sync-on-startup: true
  limits:
    checks-per-client-per-hour: ${CHECKS_PER_CLIENT_PER_HOUR:15}
    checks-per-day: ${CHECKS_PER_DAY:300}
  diagnostics:
    # Smoke-test endpoints that spend API credits. Keep false anywhere public.
    enabled: ${DIAGNOSTICS_ENABLED:false}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    graph-url: ${WHATSAPP_GRAPH_URL:https://graph.facebook.com/v23.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    alert-template: ${WHATSAPP_ALERT_TEMPLATE:dawaguard_batch_alert}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
  demo:
    token: ${DEMO_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
