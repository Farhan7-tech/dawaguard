<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="t">
  <title id="t">Built with NVIDIA Nemotron on Nebius Token Factory. Made in India for Indian families.</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .pulse { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 4s ease-in-out infinite; }
    .dot { transform-box: fill-box; transform-origin: center; animation: beat 4s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 55% { stroke-dashoffset: 0; opacity: 1; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes beat { 0%, 30% { transform: scale(1); } 38% { transform: scale(1.5); } 46%, 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; stroke-dashoffset: 0; } .dot { animation: none; } }
  </style>

  <rect x="1" y="1" width="1198" height="218" rx="20" fill="#0A0A0A" stroke="#3D3C38" stroke-width="2"/>

  <!-- Heartbeat line -->
  <path d="M60 72 H470 L490 72 L506 44 L524 104 L542 24 L560 112 L576 72 H640 L652 60 L664 72 H1140"
        class="pulse" pathLength="1" fill="none" stroke="#D85A30" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 72 H1140" fill="none" stroke="#2A2926" stroke-width="1"/>

  <!-- Small logo -->
  <g transform="translate(372 120)">
    <rect width="36" height="36" rx="9" fill="#F4EEE2"/>
    <rect x="15" y="8" width="6" height="20" rx="1.5" fill="#0A0A0A"/>
    <rect x="8" y="15" width="20" height="6" rx="1.5" fill="#0A0A0A"/>
    <circle class="dot" cx="29" cy="7" r="3.5" fill="#D85A30"/>
  </g>
  <text x="424" y="146" class="sans" font-size="22" font-weight="600" fill="#F4EEE2">Built with NVIDIA Nemotron on Nebius Token Factory</text>
  <text x="600" y="186" class="sans" font-size="16" fill="#A8A49C" text-anchor="middle">Made in India for Indian families. Open source under the MIT License.</text>
</svg>
